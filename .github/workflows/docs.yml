name: Documentation

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

# Allow this workflow's GITHUB_TOKEN to push to gh-pages.
permissions:
  contents: write
  pull-requests: read
  statuses: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Instantiate docs environment
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy documentation
        run: julia --project=docs docs/make.jl
        env:
          # Documenter uses the ambient GITHUB_TOKEN to push to gh-pages when
          # running on GitHub Actions -- no separate DOCUMENTER_KEY deploy key
          # needed for a repo you own. deploydocs() itself checks CI/GITHUB_*
          # env vars and no-ops for a plain `pull_request` build from a fork
          # (push_preview only applies to PRs from within this repo).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULIA_DEBUG: Documenter
