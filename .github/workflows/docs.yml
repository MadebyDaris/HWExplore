name: Documentation

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Instantiate docs environment
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build documentation
        run: julia --project=docs docs/make.jl
        env:
          JULIA_DEBUG: Documenter
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  # Deploys straight to GitHub Pages via the native Actions deployment API --
  # no gh-pages branch, no Jekyll. Requires Settings -> Pages -> Source ->
  # "GitHub Actions" (not "Deploy from a branch"). Skipped on PRs, since
  # Pages only has one live deployment target.
  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
